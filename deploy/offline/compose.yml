name: data-sync-mvp-offline

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
    ports:
      - "${MYSQL_PORT:-13316}:3306"
    volumes:
      - ./runtime/mysql:/var/lib/mysql
      - ./database/001-ry-vue.sh:/docker-entrypoint-initdb.d/001-ry-vue.sh:ro
      - ./database/ry_vue.sql:/docker-entrypoint-initdb.d/ry_vue.seed:ro
      - ./database/ry_sync.sql:/docker-entrypoint-initdb.d/ry_sync.seed:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    pull_policy: never
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-16389}:6379"
    volumes:
      - ./runtime/redis:/redis/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  seatunnel:
    image: ${SEATUNNEL_IMAGE:-data-sync-poc/seatunnel:2.3.13}
    pull_policy: never
    restart: unless-stopped
    environment:
      # The FULL-mode Jdbc source pins serverTimezone=UTC so a zoneless DATETIME
      # round-trips unchanged; that only holds if the engine JVM is on UTC too.
      TZ: UTC
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SEATUNNEL_PORT:-18084}:8080"
    volumes:
      - ./seatunnel/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml:ro
      - ./runtime/seatunnel/checkpoint:/opt/seatunnel/checkpoint
      - ./runtime/seatunnel/logs:/opt/seatunnel/logs

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.8.0}
    pull_policy: never
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - ./runtime/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${CADDY_IMAGE:-caddy:2.8.4-alpine}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-18082}
    ports:
      - "${WEB_PORT:-18083}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
