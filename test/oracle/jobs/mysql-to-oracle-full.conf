env {
  job.mode = "BATCH"
  parallelism = 1
  read_limit.rows_per_second = 1000
  read_limit.bytes_per_second = 10485760
}

source {
  Jdbc {
    url = "jdbc:mysql://ds-poc-mysql:3306/source_db"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "seatunnel"
    password = "seatunnel_pw"
    query = "SELECT id, email, display_name, active, credit, notes, registered_at, updated_at FROM customers"
    result_table_name = "mysql_customers"
  }
}

sink {
  Jdbc {
    url = "jdbc:oracle:thin:@//ds-poc-oracle:1521/FREEPDB1"
    driver = "oracle.jdbc.OracleDriver"
    username = "poc"
    password = "poc_password"
    query = "MERGE INTO DS_POC_CUSTOMERS target USING (SELECT ? AS ID, ? AS EMAIL, ? AS DISPLAY_NAME, ? AS ACTIVE, ? AS CREDIT, ? AS NOTES, ? AS REGISTERED_AT, ? AS UPDATED_AT FROM DUAL) source ON (target.ID = source.ID) WHEN MATCHED THEN UPDATE SET target.EMAIL = source.EMAIL, target.DISPLAY_NAME = source.DISPLAY_NAME, target.ACTIVE = source.ACTIVE, target.CREDIT = source.CREDIT, target.NOTES = source.NOTES, target.REGISTERED_AT = source.REGISTERED_AT, target.UPDATED_AT = source.UPDATED_AT WHEN NOT MATCHED THEN INSERT (ID, EMAIL, DISPLAY_NAME, ACTIVE, CREDIT, NOTES, REGISTERED_AT, UPDATED_AT) VALUES (source.ID, source.EMAIL, source.DISPLAY_NAME, source.ACTIVE, source.CREDIT, source.NOTES, source.REGISTERED_AT, source.UPDATED_AT)"
    batch_size = 100
    max_retries = 5
  }
}
