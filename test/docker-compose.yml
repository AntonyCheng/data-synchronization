name: data-sync-poc

services:
  mysql:
    image: mysql:8.0
    container_name: ds-poc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-poc_root_pw}
      TZ: UTC
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=604800
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${POC_MYSQL_PORT:-23306}:3306"
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./cases:/poc-cases:ro
      - ./runtime/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - poc

  postgres:
    image: postgres:17.6-bookworm
    container_name: ds-poc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poc_password}
      POSTGRES_DB: ${POSTGRES_DB:-sink_db}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POC_POSTGRES_PORT:-25432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./cases:/poc-cases:ro
      - ./runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - poc

  seatunnel:
    build:
      context: ./docker/seatunnel
      args:
        SEATUNNEL_VERSION: "2.3.13"
    image: data-sync-poc/seatunnel:2.3.13
    container_name: ds-poc-seatunnel
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
    ports:
      - "18080:8080"
    volumes:
      - ./docker/seatunnel/config/seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml:ro
      - ./jobs:/opt/seatunnel/config/poc-jobs:ro
      - ./runtime/seatunnel/checkpoint:/opt/seatunnel/checkpoint
      - ./runtime/seatunnel/logs:/opt/seatunnel/logs
      - ./results:/opt/seatunnel/poc-results
    networks:
      - poc

networks:
  poc:
    name: data-sync-poc-network
