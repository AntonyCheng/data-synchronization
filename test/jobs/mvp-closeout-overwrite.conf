env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 5000
  checkpoint.timeout = 60000
}

source {
  MySQL-CDC {
    url = "jdbc:mysql://ds-poc-mysql:3306/source_db"
    username = "seatunnel"
    password = "seatunnel_pw"
    database-names = ["source_db"]
    table-names = ["source_db.customers"]
    server-id = "5911-5914"
    server-time-zone = "UTC"
    startup.mode = "initial"
    exactly_once = false
    schema-changes.enabled = false
    plugin_output = "mvp_closeout_source"
  }
}

transform {
  Sql {
    query = "SELECT * FROM mvp_closeout_source"
    plugin_input = ["mvp_closeout_source"]
    plugin_output = "mvp_closeout_projected"
  }
}

sink {
  Jdbc {
    url = "jdbc:postgresql://ds-poc-postgres:5432/sink_db"
    driver = "org.postgresql.Driver"
    username = "poc"
    password = "poc_password"
    database = "sink_db"
    table = "public.mvp_closeout_stage"
    primary_keys = ["id"]
    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "DROP_DATA"
    enable_upsert = true
    batch_size = 100
    max_retries = 5
    plugin_input = ["mvp_closeout_projected"]
  }
}
