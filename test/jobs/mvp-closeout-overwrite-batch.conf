env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Jdbc {
    url = "jdbc:mysql://ds-poc-mysql:3306/source_db"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "seatunnel"
    password = "seatunnel_pw"
    query = "SELECT `id`, `email`, `display_name`, `active`, `credit`, `profile`, `notes`, `registered_at`, `updated_at` FROM source_db.customers"
    result_table_name = "mvp_closeout_source"
  }
}

sink {
  Jdbc {
    url = "jdbc:postgresql://ds-poc-postgres:5432/sink_db"
    driver = "org.postgresql.Driver"
    username = "poc"
    password = "poc_password"
    database = "sink_db"
    table = "public.mvp_closeout_stage"
    primary_keys = ["id"]
    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "DROP_DATA"
    enable_upsert = true
    batch_size = 100
    max_retries = 5
  }
}
