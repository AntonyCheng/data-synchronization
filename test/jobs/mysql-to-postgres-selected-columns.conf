env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 5000
  checkpoint.timeout = 60000
}

source {
  MySQL-CDC {
    url = "jdbc:mysql://ds-poc-mysql:3306/source_db"
    username = "seatunnel"
    password = "seatunnel_pw"
    database-names = ["source_db"]
    table-names = ["source_db.customers"]
    server-id = "5790-5793"
    server-time-zone = "UTC"
    startup.mode = "initial"
    exactly_once = false
    schema-changes.enabled = false
    plugin_output = "customers"
  }
}

transform {
  Sql {
    plugin_input = ["customers"]
    plugin_output = "customers_selected"
    query = "select `id`, `display_name`, `updated_at` from customers"
  }
}

sink {
  Jdbc {
    url = "jdbc:postgresql://ds-poc-postgres:5432/sink_db"
    driver = "org.postgresql.Driver"
    username = "poc"
    password = "poc_password"
    database = "sink_db"
    table = "public.customers_selected"
    primary_keys = ["id"]
    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    enable_upsert = true
    plugin_input = ["customers_selected"]
  }
}
