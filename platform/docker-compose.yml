name: data-sync-platform

services:
  dbs-mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4.9}
    container_name: dbs-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ry-vue}
    ports:
      - "13306:3306"
    volumes:
      - ./runtime/mysql-v2:/var/lib/mysql
      - ./init/001-ry-vue.sh:/docker-entrypoint-initdb.d/001-ry-vue.sh:ro
      - ../server/script/sql/ry_vue.sql:/docker-entrypoint-initdb.d/ry_vue.seed:ro
      - ../server/script/sql/ry_sync.sql:/docker-entrypoint-initdb.d/ry_sync.seed:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --explicit_defaults_for_timestamp=true
      - --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - platform

  dbs-redis:
    image: ${REDIS_IMAGE:-redis:8.6.3}
    container_name: dbs-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - ../server/script/docker/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./runtime/redis:/redis/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-ruoyi123}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-ruoyi123}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - platform

networks:
  platform:
    name: data-sync-platform-network
